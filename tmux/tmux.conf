# Use vim keybindings in copy mode
setw -g mode-keys vi

# Make selecting and copying feel exactly like Neovim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Remap split panes to feel more intuitive (Optional but helpful)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Copy directly to system clipboard using xclip
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clipboard -in"

# Enable mouse support (allows clicking to focus/resize panes)
set -g mouse on

# Bind Vim-style keys for pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ==========================================
# Tmux Plugin Manager & Plugins
# ==========================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tmux Resurrect configurations
# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'
# Change save and restore keys (Prefix + S to save, Prefix + R to restore)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Tmux Continuum configurations
# Automatic restore of last saved environment
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
